; ESP32-S3 Audio Controller - project skeleton
; Platform: pioarduino (arduino-esp32 3.3.x / IDF 5.5.x).
;
; COMPATIBILITY NOTE: Latest ESP32-audioI2S (master) does NOT compile
; on Arduino-ESP32 3.1.x (IDF 5.3, platform 53.03.13) due to C++20 usage.
; Author (schreibfaul1) recommends pioarduino 55.03.37 (Arduino 3.3.7 / IDF 5.5.2).

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; --- Web UI (Prompt 19) ---
; webui/** -> gzip -> src/net/web_assets_gen.cpp. Runs before every build (before
; sources are scanned); can also be run manually: python tools/build_web.py
extra_scripts = pre:tools/build_web.py

; --- Flash / PSRAM (16 MB flash, 8 MB octal PSRAM) ---
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

; --- UART0 console, USB CDC disabled ---
; NOTE: -DBOARD_HAS_PSRAM is mandatory for octal PSRAM in pioarduino 55.x
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=3

; --- Monitor ---
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
monitor_echo = yes
monitor_eol = LF

; --- Upload ---
upload_speed = 921600

; --- Dependencies ---
; lib_ldf_mode = chain prevents overly aggressive scanning.
; FS, WiFi, Network, SD, SD_MMC, Update are NOT ignored: they are critical for
; LittleFS, ESPAsyncWebServer, and ESP32-audioI2S (which unconditionally pulls SD.h).
lib_ldf_mode = chain
lib_ignore =
    BluetoothSerial
    SimpleBLE

lib_deps =
    lovyan03/LovyanGFX@^1.2.0
    https://github.com/schreibfaul1/ESP32-audioI2S.git
    https://github.com/ESP32Async/ESPAsyncWebServer.git
    https://github.com/ESP32Async/AsyncTCP.git
    bblanchon/ArduinoJson@^7.4.1

; --- LittleFS ---
; The web UI is embedded into the firmware (tools/build_web.py), so no filesystem
; image is needed. LittleFS holds only stations.json.
; DO NOT use "pio run -t buildfs" / "uploadfs": it erases stations.json.
; To update the device use "pio run -t upload" or OTA.